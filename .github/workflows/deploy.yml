name: CI — unit tests → deploy → mabl E2E → report

# Agentic quality pipeline for Galaxy Explorer.
#   1. unit-test : Claude-authored Vitest suite (dev-QA layer) — gates everything
#   2. deploy    : publish the static site to GitHub Pages (official actions)
#   3. e2e       : mabl deployment event via the official run-mabl-tests Action
#                  (independent verification layer; results appear as a PR check
#                   when the mabl bot GitHub app is installed)
#   4. report    : on mabl failure, file a Jira bug (SUP) + Slack alert
#
# See docs/MABL-AGENTIC-CICD-SETUP.md for the full setup guide + manual steps.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Unit tests (dev-QA layer) — must pass before we deploy ──────
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  # ── 2. Deploy the static site to GitHub Pages (official actions) ───
  #     Requires: repo Settings → Pages → Source = "GitHub Actions".
  deploy:
    needs: unit-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish the deliberately-broken `demo-regression` branch alongside the main
      # build, at /regression/. This gives the CSE triage demo a stable, publicly
      # reachable FAILING target so a dedicated mabl environment can point at it —
      # without ever repointing the shared prod environment URL that every other
      # demo type depends on.
      #
      # NOTE: deliberately NOT continue-on-error. That flag reports a failed step's
      # conclusion as "success" in the API, which hides real breakage. A failed deploy
      # job simply leaves the previous Pages deployment live, so the site is protected
      # either way — surfacing the failure is strictly better.
      - name: Check out regression build
        uses: actions/checkout@v4
        with:
          ref: demo-regression
          path: regression

      # Writes what actually got packaged into the published site itself, so the
      # deploy can be verified by fetching a URL rather than by reading run logs.
      # Filename deliberately has NO leading underscore — Jekyll excludes those.
      - name: Write deploy manifest
        shell: bash
        run: |
          {
            echo "commit:  ${{ github.sha }}"
            echo "run:     ${{ github.run_id }}"
            echo "built:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "--- top-level entries ---"
            ls -1
            echo
            echo "--- regression/ present? ---"
            if [ -d regression ]; then
              echo "YES"
              ls -1 regression
              echo
              echo "--- regression/app.js setSort (expect NO 'page = 1') ---"
              grep -n 'setSort(v)' regression/app.js || echo "regression/app.js NOT FOUND"
            else
              echo "NO - regression directory is missing from the workspace"
            fi
            echo
            echo "--- main app.js setSort (expect 'page = 1') ---"
            grep -n 'setSort(v)' app.js
          } > deploy-manifest.txt
          cat deploy-manifest.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'            # static app lives at repo root
      - id: deployment
        uses: actions/deploy-pages@v4

  # ── 3. mabl E2E (independent verification layer) ──────────────────
  #     Official Action triggers a mabl deployment event and polls to completion.
  #     Auto-passes github.sha → enables the mabl PR check (via mabl bot app).
  #     A plan only runs if it matches app/env + the "ci" label (CASE-SENSITIVE),
  #     is active, has ≥1 test enabled, AND has the deployment trigger toggled ON.
  e2e:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      # NOTE: confirm exact input names against the marketplace README:
      # https://github.com/marketplace/actions/run-mabl-tests
      - name: Run mabl tests
        uses: mablhq/github-run-tests-action@v1.16
        env:
          MABL_API_KEY: ${{ secrets.MABL_API_KEY }}   # MUST be a "CI/CD integration" key type
        with:
          application-id: ${{ secrets.MABL_APPLICATION_ID }}
          environment-id: ${{ secrets.MABL_ENVIRONMENT_ID }}
          plan-labels: ci
          app-url: https://ryan-cse.github.io/galaxy-explorer-demo/?demo=true
          # browser-types: chrome            # optional override
          # continue-on-failure: false       # default: fail the job (and PR check) on any test failure

  # ── 4. Report failures → Jira (SUP) + Slack ───────────────────────
  #     Only runs when the mabl E2E job failed. Demo tickets are clearly
  #     marked and land in the Damien-approved SUP project.
  report-failure:
    needs: e2e
    # NOT failure() — that is true when ANY earlier job failed, so a unit-gate
    # failure (which skips e2e entirely) filed a ticket blaming mabl for a stage
    # that never ran. Gate on the e2e job's own result instead.
    if: ${{ needs.e2e.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create Jira issue (SUP)
        run: |
          AUTH=$(echo -n "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" | base64 -w 0)
          SHA_SHORT=$(echo '${{ github.sha }}' | cut -c1-8)
          SUMMARY="[Galaxy Explorer DEMO] mabl E2E failure @ ${SHA_SHORT}"
          BODY="Automated mabl E2E suite failed after deploying to GitHub Pages.\n\n*Commit:* ${{ github.sha }}\n*Branch:* ${{ github.ref_name }}\n*Actor:* ${{ github.actor }}\n*Workflow run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n*Failing tests:* see the mabl results linked from the workflow run above. Do not assume a flow — read the run."
          curl -sf -X POST \
            "${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue" \
            -H "Authorization: Basic $AUTH" \
            -H "Content-Type: application/json" \
            -d "{
              \"fields\": {
                \"project\": {\"key\": \"${{ secrets.JIRA_PROJECT_KEY }}\"},
                \"summary\": \"$SUMMARY\",
                \"issuetype\": {\"name\": \"Bug\"},
                \"labels\": [\"galaxy-explorer\", \"demo\", \"mabl\", \"ci\"],
                \"description\": {
                  \"version\": 1, \"type\": \"doc\",
                  \"content\": [{\"type\": \"paragraph\", \"content\": [{\"type\": \"text\", \"text\": \"$BODY\"}]}]
                }
              }
            }"

      - name: Send Slack alert
        # Auto-skips if no webhook secret is set, so missing Slack perms don't break the job.
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          SHA_SHORT=$(echo '${{ github.sha }}' | cut -c1-8)
          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{
              "text": ":x: *Galaxy Explorer — mabl E2E failure* (`'"$SHA_SHORT"'`)",
              "attachments": [{
                "color": "danger",
                "fields": [
                  {"title": "Branch", "value": "${{ github.ref_name }}", "short": true},
                  {"title": "Actor", "value": "${{ github.actor }}", "short": true},
                  {"title": "GitHub Actions", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>", "short": true}
                ]
              }]
            }'
